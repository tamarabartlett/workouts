<div class="home-layout">
  <mat-toolbar class="app-toolbar">
    @if (!isWideScreen()) {
      <button
        matIconButton
        type="button"
        class="menu-button"
        (click)="toggleSidenav()"
        [attr.aria-label]="sidenavOpened() ? 'Hide workouts list' : 'Show workouts list'"
        [attr.aria-expanded]="sidenavOpened()"
      >
        <mat-icon>menu</mat-icon>
      </button>
    }
    <button
      type="button"
      class="toolbar-brand"
      (click)="goToNextWorkout()"
      aria-label="Show next workout"
    >
      <img
        src="dumbbell.png"
        alt=""
        class="toolbar-brand__logo"
        aria-hidden="true"
      />
      <span class="toolbar-brand__title">Workouts</span>
    </button>
    <span class="spacer"></span>
    <div class="toolbar-actions">
      <button matButton type="button" (click)="exportHistory()">Export</button>
      <button matButton type="button" (click)="triggerImport()">Import</button>
      <button matButton type="button" (click)="logout()">Log out</button>
    </div>
  </mat-toolbar>

  <input
    #fileInput
    type="file"
    accept="application/json,.json"
    class="visually-hidden"
    (change)="onImportFileSelected($event)"
  />

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      class="workouts-sidenav"
      [mode]="sidenavMode()"
      [opened]="sidenavOpened()"
      (openedChange)="onSidenavOpenedChange($event)"
      [disableClose]="isWideScreen()"
    >
      <app-past-workouts
        [selectedWorkoutId]="selectedWorkoutId()"
        [mainView]="mainView()"
        (startNewWorkout)="startNewWorkout()"
        (selectWorkout)="selectWorkout($event)"
      />
    </mat-sidenav>

    <mat-sidenav-content class="main-pane">
      <app-home-main
        [mainView]="mainView()"
        [selectedWorkout]="selectedWorkout()"
        [statusMessage]="statusMessage()"
        [statusKind]="statusKind()"
        (dismissStatus)="dismissStatus()"
        (save)="onNewWorkoutSaved($event)"
        (cancel)="onNewWorkoutCancelled()"
        (patchSet)="onSelectedWorkoutSetPatched($event)"
        (noteChange)="onSelectedWorkoutNoteChanged($event)"
        (startNewWorkout)="startNewWorkout()"
      />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
