<mat-card class="workout-day-card" appearance="outlined">
  <mat-card-header class="card-header">
    <mat-card-title>{{ date() | date: 'fullDate' }}</mat-card-title>
    <span class="header-spacer" aria-hidden="true"></span>
    <button
      matButton
      type="button"
      (click)="toggleEditing()"
      [attr.aria-pressed]="isEditing()"
      [attr.aria-label]="isEditing() ? 'Finish editing workout' : 'Edit workout'"
    >
      {{ isEditing() ? 'Done' : 'Edit' }}
    </button>
  </mat-card-header>
  <mat-card-content class="card-body">
    @if (isEditing() || note()) {
      <mat-expansion-panel class="note-panel" hideToggle="false">
        <mat-expansion-panel-header>
          <mat-panel-title>Note</mat-panel-title>
          <mat-panel-description class="note-preview">
            {{ note() || 'Tap to add a note' }}
          </mat-panel-description>
        </mat-expansion-panel-header>
        @if (isEditing()) {
          <mat-form-field appearance="outline" class="note-field">
            <mat-label>Note</mat-label>
            <textarea
              matInput
              rows="2"
              [value]="note()"
              (input)="onNoteInput($event)"
              placeholder="How did it feel? Any tweaks?"
              autocomplete="off"
            ></textarea>
          </mat-form-field>
        } @else {
          <p class="note-display">{{ note() }}</p>
        }
      </mat-expansion-panel>
    }

    @for (ex of exercises(); track $index) {
      <app-exercise
        [exercise]="ex"
        [exerciseIndex]="$index"
        [editable]="isEditing()"
        (patchSet)="patchSet.emit($event)"
      />
    }
  </mat-card-content>
</mat-card>
